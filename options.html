<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Shopee Chat Translator 設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <header>
        <h1>Shopee Chat Translator 設定</h1>
        <p>音声入力とメッセージ翻訳の挙動をカスタマイズします。</p>
      </header>

      <form id="options-form">
        <section>
          <h2>音声入力</h2>
          <label class="field">
            <span>音声認識の言語</span>
            <select name="speechRecognitionLocale" id="speechRecognitionLocale">
              <option value="ja-JP">日本語 (ja-JP)</option>
              <option value="en-US">英語 (en-US)</option>
              <option value="zh-CN">中国語 (zh-CN)</option>
            </select>
          </label>
        </section>

        <section>
          <h2>送信メッセージ</h2>
          <label class="field">
            <span>相手の言語</span>
            <select name="outgoingLanguage" id="outgoingLanguage">
              <option value="en">英語</option>
              <option value="zh-CN">中国語 (簡体字)</option>
              <option value="zh-TW">中国語 (繁体字)</option>
              <option value="id">インドネシア語</option>
              <option value="vi">ベトナム語</option>
              <option value="th">タイ語</option>
              <option value="ms">マレー語</option>
              <option value="tl">タガログ語</option>
            </select>
          </label>
        </section>

        <section>
          <h2>受信メッセージ</h2>
          <label class="field">
            <span>翻訳先の言語</span>
            <select name="incomingLanguage" id="incomingLanguage">
              <option value="ja">日本語</option>
              <option value="en">英語</option>
            </select>
          </label>

          <label class="field field--checkbox">
            <input type="checkbox" name="autoTranslateIncoming" id="autoTranslateIncoming" />
            <span>新しいメッセージを自動的に翻訳する</span>
          </label>
        </section>

        <footer>
          <button type="submit">保存</button>
          <p id="status" role="status" aria-live="polite"></p>
        </footer>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
